# Chaîne de gates de Tarjih, exécutée à chaque poussée et sur chaque pull request.
#
# Trois périmètres, chacun avec la version exacte de la production :
#   web         — Node 22 (Dockerfile) : lint, typecheck, tests, build ;
#   calculation — Python 3.13 (Dockerfile du moteur) : ruff, mypy strict, tests,
#                 contrôle des artefacts de prompts ;
#   database    — image `supabase/postgres` du serveur : toute la chaîne du schéma
#                 rejouée sur une base vide (`scripts/db-gates.sh`).
#
# Les recettes Playwright ne tournent PAS ici : elles jouent contre la production
# avec des comptes du coffre, et deux exécutions simultanées sur les mêmes tenants
# de recette se télescoperaient. Elles restent lancées depuis le poste, par le
# broker de secrets, avant chaque déploiement.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/calculation/pyproject.toml
      - run: pip install -e "services/calculation[api,dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
        working-directory: services/calculation
      - run: python -m unittest discover -s tests
        working-directory: services/calculation
      - run: python scripts/validate_prompt_artifacts.py

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même image que `supabase-db` en production (relevée le 2026-09-14).
        image: supabase/postgres:15.8.1.085
        # Variables du service `db` du Compose Supabase auto-hébergé (mêmes noms
        # qu'en production, valeurs factices : rien ici n'est un secret).
        env:
          POSTGRES_HOST: /var/run/postgresql
          PGPORT: 5432
          POSTGRES_PORT: 5432
          PGPASSWORD: gate-factice
          POSTGRES_PASSWORD: gate-factice
          PGDATABASE: postgres
          POSTGRES_DB: postgres
          JWT_SECRET: gate-factice-gate-factice-gate-factice-32
          JWT_EXP: 3600
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - name: Rejouer la chaîne du schéma sur une base vide
        env:
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q
          PSQL_ADMIN: docker exec -i ${{ job.services.postgres.id }} psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q
          PGDUMP: docker exec ${{ job.services.postgres.id }} pg_dump -U postgres --schema-only postgres
        run: bash scripts/db-gates.sh
